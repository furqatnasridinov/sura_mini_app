name: quran_suras
description: A Quran Suras learning app for Telegram Mini App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local storage - stores memorized suras in browser localStorage
  shared_preferences: ^2.2.2

  # Google Fonts - Amiri (Arabic-style) + Montserrat
  google_fonts: ^6.1.0

  # JS interop - to communicate with Telegram WebApp JS SDK
  js: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
